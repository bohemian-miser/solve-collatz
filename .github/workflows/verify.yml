name: Verify Theorem Swarm

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check frozen challenge & verification files (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_challenge_frozen.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Check Lean source hygiene guards
        run: python3 scripts/check_source_guards.py

      - name: Cache elan toolchain and Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
            lean-${{ runner.os }}-

      - name: Install elan if not cached
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build all Lean targets (warnings as errors)
        run: lake build

      - name: Audit axioms of every library declaration (standard axioms only)
        run: python3 scripts/audit_axioms.py

      - name: Run problem-specific barrier & search CI hook (from problem.toml)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tomllib
          cfg = tomllib.loads(pathlib.Path("problem.toml").read_text(encoding="utf-8"))
          hook = cfg.get("search", {}).get("ci_hook", "").strip()
          if hook and pathlib.Path(hook).exists():
              print(f"Running search CI hook: {hook}")
              res = subprocess.run(["bash", hook], check=False)
              sys.exit(res.returncode)
          print("No search CI hook configured; skipping.")
          PY
