# Single-file manifest driving all `solve-anything` CI workflows, guards, and dashboard generation.

[problem]
name = "solve-collatz"
title = "Collatz Conjecture (3n + 1)"
tagline = "Lean 4 kernel-verified dual-track crowd-swarm for the Collatz (3n + 1) conjecture (Track A: Prove · Track B: Disprove)."
lean_root = "Collatz"
namespace = "SolveCollatz"
challenge_file = "Challenge.lean"
conjecture_decl = "SolveCollatz.CollatzConjecture"
disproof_decl = "SolveCollatz.CollatzDisproof"

[guards]
max_line_length = 100
max_file_lines = 1000
max_proof_lines = 50
frozen_files = [
  "Challenge.lean",
  "problem.toml",
  "lean-toolchain",
  "scripts/PrintAxioms.lean",
  "scripts/check_challenge_frozen.py",
  "scripts/check_source_guards.py",
  ".github/workflows/verify.yml",
  ".github/workflows/claims.yml",
  ".github/workflows/dashboard.yml",
  ".github/workflows/label-pr.yml",
]

[search]
ci_hook = "search/ci_checks.sh"
